{% extends "base.html" %}
{% block title %}Registrar Salario{% endblock %}
{% block content %}
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4">Registrar Nuevo Salario</h2>
        <form method="POST" action="{{ url_for('crear_salario') }}">
            <div class="form-group">
                <label for="user_id">Empleado</label>
                <select class="form-control" id="user_id" name="user_id" required>
                    {% for user in usuarios %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="monto">Monto</label>
                <input type="number" class="form-control" id="monto" name="monto" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Registrar Salario</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2">Volver</a>
        </form>
    </div>
{% endblock %}

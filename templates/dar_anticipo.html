{% extends "base.html" %}
{% block title %}Dar Anticipo{% endblock %}
{% block content %}
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4">Dar Anticipo a Técnico</h2>
        <form method="POST" action="{{ url_for('dar_anticipo') }}">
            <div class="form-group">
                <label for="tecnico_id">Técnico</label>
                <select class="form-control" id="tecnico_id" name="tecnico_id" required>
                    {% for user in tecnicos %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="monto">Monto</label>
                <input type="number" class="form-control" id="monto" name="monto" step="0.01" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Dar Anticipo</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2">Volver</a>
        </form>
    </div>
{% endblock %}

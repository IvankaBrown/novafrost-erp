<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP NovaFrost</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: linear-gradient(135deg, #0d6efd, #0dcaf0); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { width: 100%; max-width: 400px; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .logo { font-size: 3rem; font-weight: bold; color: #fff; text-align: center; margin-bottom: 20px; }
        .hr-line { border-top: 3px solid #fff; margin: 20px 0; }
    </style>
</head>
<body>
    <div class="login-card bg-white">
        <div class="logo">Logo NovaFrost</div>
        <hr class="hr-line">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger">
                    {{ messages[0] }}
                </div>
            {% endif %}
        {% endwith %}
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required autofocus>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
        
        <div class="text-center mt-3">
            <small class="text-muted">ERP para reparación de refrigeradoras y lavadoras en Lima</small>
        </div>
    </div>
</body>
</html>

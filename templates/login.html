<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ERP NovaFrost</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- PWA MANIFEST + ÍCONOS (ahora con maskable y todo perfecto) -->
    <link rel="manifest" href="/static/manifest.json">
    <link rel="apple-touch-icon" sizes="192x192" href="/static/logo192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/static/logo512.png">
    <meta name="theme-color" content="#0066ff">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Favicon normal -->
    <link rel="icon" href="/static/logo192.png" sizes="192x192">
    <link rel="icon" href="/static/logo512.png" sizes="512x512">

    <!-- REGISTRO DEL SERVICE WORKER (sin Jinja dentro del JS → ya no da error) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js')
                    .then(reg => console.log('Service Worker registrado →', reg.scope))
                    .catch(err => console.error('Error SW:', err));
            });
        }
    </script>

    <style>
        body { 
            background: linear-gradient(135deg, #0d6efd, #0dcaf0); 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
        }
        .login-card { 
            width: 100%; 
            max-width: 420px; 
            padding: 40px; 
            border-radius: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.3); 
            background: white;
        }
        .logo img {
            max-height: 90px;
            display: block;
            margin: 0 auto 20px;
        }
        .hr-line { 
            height: 4px;
            background: #0066ff;
            border: none;
            border-radius: 2px;
            margin: 25px 0;
        }
        small { font-size: 0.85rem; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="text-center">
            <div class="logo">
                <img src="/static/logo.png" alt="NovaFrost ERP">
            </div>
            <h2 class="mb-2 text-primary">ERP NovaFrost</h2>
            <p class="text-muted">v1.0 • Lima, Perú</p>
        </div>

        <hr class="hr-line">

        <!-- Mensajes flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show">
                        {{ message }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- FORMULARIO DE LOGIN (ahora pide EMAIL) -->
        <form method="POST" novalidate>
            <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" name="email" class="form-control form-control-lg" 
                       placeholder="tunombre@novafrost.com" required autofocus>
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold">Contraseña</label>
                <input type="password" name="password" class="form-control form-control-lg" 
                       placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">
                Iniciar Sesión
            </button>
        </form>

        <div class="text-center mt-4">
            <small class="text-muted">
                Sistema de gestión para técnicos de refrigeración y lavado
            </small>
        </div>
    </div>

    <!-- Bootstrap JS (para los alerts) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

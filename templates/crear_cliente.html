{% extends "base.html" %}
{% block title %}Crear Cliente{% endblock %}
{% block content %}
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4">Crear Nuevo Cliente</h2>
        <form method="POST">
            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" class="form-control" name="nombre" required>
            </div>
            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="text" class="form-control" name="telefono" required>
            </div>
            <div class="form-group">
                <label for="direccion">Dirección:</label>
                <input type="text" class="form-control" name="direccion" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Crear Cliente</button>
            <a href="{{ url_for('listar_clientes') }}" class="btn btn-secondary mt-2">Volver</a>
        </form>
    </div>
{% endblock %}

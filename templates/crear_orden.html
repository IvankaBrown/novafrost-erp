{% extends "base.html" %}
{% block title %}Crear Orden - NovaFrost ERP{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <h2 class="mb-0 fw-bold">Nueva Orden de Servicio</h2>
                    <p class="mb-0 opacity-90">Complete todos los datos del cliente y servicio</p>
                </div>
                
                <div class="card-body p-5">
                    <form method="POST" action="{{ url_for('crear_orden') }}">
                        <div class="row g-4">

                            <!-- BUSCADOR DE CLIENTE PRO -->
                            <div class="col-md-6 position-relative">
                                <label class="form-label fw-bold text-primary">Cliente *</label>
                                
                                <input type="text" id="buscador_cliente" class="form-control form-control-lg" 
                                       placeholder="Escribe para buscar cliente..." autocomplete="off" required>
                                
                                <div id="resultados_busqueda" 
                                     class="position-absolute top-100 start-0 w-100 bg-white border rounded shadow-lg mt-1" 
                                     style="z-index: 1000; max-height: 300px; overflow-y: auto; display: none;">
                                </div>
                                
                                <input type="hidden" name="cliente_id" id="cliente_id" required>

                                <div id="info_cliente" class="mt-3 p-3 bg-light rounded border" style="display: none;">
                                    <strong id="info_nombre" class="text-primary fs-5"></strong><br>
                                    <span id="info_telefono" class="text-muted"></span> • 
                                    <span id="info_distrito" class="text-muted"></span><br>
                                    <small class="text-success">Medio: <span id="info_medio"></span></small>
                                </div>

                                <div class="mt-2">
                                    <small class="text-muted">¿Cliente nuevo? 
                                        <a href="#" data-bs-toggle="modal" data-bs-target="#nuevoClienteModal" 
                                           class="text-success fw-bold">+ Crear cliente</a>
                                    </small>
                                </div>
                            </div>

                            <!-- TÉCNICO -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-primary">Técnico Asignado</label>
                                <select name="tecnico_id" class="form-select form-select-lg" required>
                                    <option value="">Seleccionar técnico</option>
                                    {% for t in tecnicos %}
                                    <option value="{{ t.id }}">{{ t.nombre_completo() }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- TIPO DE APARATO -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-primary">Tipo de Aparato</label>
                                <select name="tipo_aparato" class="form-select form-select-lg" required>
                                    <option value="Refrigerador">Refrigerador</option>
                                    <option value="Congelador">Congelador</option>
                                    <option value="Vitrina">Vitrina Refrigerada</option>
                                    <option value="Cava">Cava de Vinos</option>
                                    <option value="Máquina de Hielo">Máquina de Hielo</option>
                                    <option value="Otros">Otros</option>
                                </select>
                            </div>

                            <!-- FALLA -->
                            <div class="col-md-6">
                                <label class="form-label fw-bold text-primary">Falla Reportada</label>
                                <textarea name="falla" class="form-control form-control-lg" rows="3" 
                                          placeholder="Ej: No enfría, hace ruido, no prende..." required></textarea>
                            </div>

                            <!-- TOTAL + IGV AUTOMÁTICO -->
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-success">Total con IGV</label>
                                <input type="number" step="0.01" name="total" id="total" class="form-control form-control-lg" 
                                       placeholder="0.00" onchange="calcularIGV()" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-info">IGV (18%)</label>
                                <input type="number" step="0.01" id="igv" class="form-control form-control-lg bg-light" readonly>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-bold text-warning">Valor sin IGV</label>
                                <input type="number" step="0.01" id="valor" class="form-control form-control-lg bg-light" readonly>
                            </div>

                            <!-- NUEVOS CAMPOS: FECHA/HORA, MEDIO PAGO, COMPROBANTE -->
                             <div class="col-md-6">
                                 <label class="form-label fw-bold text-primary">Fecha y Hora de Atención</label>
                                 <input type="datetime-local" name="fecha_hora_atencion" class="form-control form-control-lg" required>
                             </div>
                             <div class="col-md-3">
                                 <label class="form-label fw-bold text-primary">Medio de Pago</label>
                                 <select name="medio_pago" class="form-select form-select-lg" required>
                                     <option value="">Seleccionar</option>
                                     <option value="yape">Yape</option>
                                     <option value="plin">Plin</option>
                                     <option value="efectivo">Efectivo</option>
                                     <option value="otro">Otro</option>
                                 </select> 
                             </div>
                             
                             <div class="col-md-3">
                                 <label class="form-label fw-bold text-primary">Comprobante</label>
                                 <select name="tipo_comprobante" class="form-select form-select-lg" required>
                                     <option value="">Seleccionar</option>
                                     <option value="boleta">Boleta</option>
                                     <option value="factura">Factura</option>
                                     <option value="otro">Otro</option>
                                </select>
                             </div>
                             
                            <!-- URGENTE -->
                            <div class="col-12">
                                <div class="form-check form-check-inline">
                                    <input class="form-check-input" type="checkbox" name="urgente" id="urgente">
                                    <label class="form-check-label text-danger fw-bold" for="urgente">
                                        URGENTE - Atender hoy mismo
                                    </label>
                                </div>
                            </div>
                        </div>

                        <hr class="my-5">

                        <div class="d-grid d-md-flex justify-content-end gap-3">
                            <a href="{{ url_for('dashboard') }}" class="btn btn-outline-secondary btn-lg">
                                Cancelar
                            </a>
                            <button type="submit" class="btn btn-success btn-lg px-5 fw-bold">
                                Crear Orden y Notificar
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL PARA CREAR CLIENTE NUEVO (el mismo que ya tienes en clientes.html) -->
<!-- Puedes copiarlo desde tu clientes.html si ya lo tienes bonito -->

<!-- SCRIPT DEL BUSCADOR PRO -->
<script>
const buscador = document.getElementById('buscador_cliente');
const resultados = document.getElementById('resultados_busqueda');
const clienteIdInput = document.getElementById('cliente_id');
const infoCliente = document.getElementById('info_cliente');

buscador.addEventListener('input', function() {
    const query = this.value.trim();
    if (query.length < 2) {
        resultados.style.display = 'none';
        return;
    }

    fetch(`/buscar_clientes?q=${encodeURIComponent(query)}`)
        .then(r => r.json())
        .then(clientes => {
            resultados.innerHTML = '';
            if (clientes.length === 0) {
                resultados.innerHTML = '<div class="p-3 text-muted">No se encontraron clientes</div>';
                resultados.style.display = 'block';
                return;
            }

            clientes.forEach(c => {
                const div = document.createElement('div');
                div.className = 'p-3 border-bottom hover-bg-light cursor-pointer';
                div.innerHTML = `
                    <div class="fw-bold">${c.nombre}</div>
                    <small class="text-muted">${c.telefono || 'Sin teléfono'} • ${c.distrito || 'Sin distrito'} • ${c.medio_contacto}</small>
                `;
                div.onclick = () => {
                    buscador.value = c.nombre;
                    clienteIdInput.value = c.id;
                    document.getElementById('info_nombre').textContent = c.nombre;
                    document.getElementById('info_telefono').textContent = c.telefono || 'Sin teléfono';
                    document.getElementById('info_distrito').textContent = c.distrito || 'Sin distrito';
                    document.getElementById('info_medio').textContent = c.medio_contacto;
                    infoCliente.style.display = 'block';
                    resultados.style.display = 'none';
                };
                resultados.appendChild(div);
            });
            resultados.style.display = 'block';
        });
});

// Cerrar al hacer click fuera
document.addEventListener('click', function(e) {
    if (!e.target.closest('#buscador_cliente') && !e.target.closest('#resultados_busqueda')) {
        resultados.style.display = 'none';
    }
});
</script>

<style>
.hover-bg-light:hover { background-color: #f8f9fa !important; cursor: pointer; }
.cursor-pointer { cursor: pointer; }
</style>

<script>
function calcularIGV() {
    const total = parseFloat(document.getElementById('total').value) || 0;
    const igv = total * (0.18 / 1.18);
    const valor = total - igv;
    document.getElementById('igv').value = igv.toFixed(2);
    document.getElementById('valor').value = valor.toFixed(2);
}
</script>
<!-- MODAL NUEVO CLIENTE (copiado de clientes.html) -->
<div class="modal fade" id="nuevoClienteModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content rounded-4">
            <form method="POST" action="{{ url_for('crear_cliente_desde_orden') }}">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title">Nuevo Cliente</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label fw-bold">Nombre del cliente *</label>
                            <input type="text" name="nombre" class="form-control form-control-lg" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Teléfono</label>
                            <input type="text" name="telefono" class="form-control form-control-lg">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Distrito</label>
                            <input type="text" name="distrito" class="form-control form-control-lg">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Dirección</label>
                            <input type="text" name="direccion" class="form-control form-control-lg">
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">Medio de contacto *</label>
                            <select name="medio_contacto" class="form-select form-select-lg" required>
                                <option value="Recomendación">Recomendación</option>
                                <option value="TikTok">TikTok</option>
                                <option value="Facebook">Facebook</option>
                                <option value="Instagram">Instagram</option>
                                <option value="YouTube">YouTube</option>
                                <option value="Google">Google</option>
                                <option value="WhatsApp">WhatsApp</option>
                                <option value="Volante">Volante / Publicidad</option>
                                <option value="Otro">Otro</option>
                            </select>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-success btn-lg px-4">Crear Cliente</button>
                </div>
            </form>
        </div>
    </div>
</div>
<script>
// Si viene cliente_nuevo_id en la URL → seleccionarlo automáticamente
const urlParams = new URLSearchParams(window.location.search);
const clienteNuevoId = urlParams.get('cliente_nuevo_id');
if (clienteNuevoId) {
    // Buscar el cliente en la base y seleccionarlo
    fetch(`/buscar_clientes?q=`)
        .then(r => r.json())
        .then(clientes => {
            const cliente = clientes.find(c => c.id == clienteNuevoId);
            if (cliente) {
                document.getElementById('buscador_cliente').value = cliente.nombre;
                document.getElementById('cliente_id').value = cliente.id;
                document.getElementById('info_nombre').textContent = cliente.nombre;
                document.getElementById('info_telefono').textContent = cliente.telefono || 'Sin teléfono';
                document.getElementById('info_distrito').textContent = cliente.distrito || 'Sin distrito';
                document.getElementById('info_medio').textContent = cliente.medio_contacto;
                document.getElementById('info_cliente').style.display = 'block';
            }
        });
}
</script>
{% endblock %}

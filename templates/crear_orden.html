{% extends "base.html" %}
{% block title %}Crear Orden{% endblock %}
{% block content %}
    <div class="container mt-5" style="max-width: 500px;">
        <h2 class="mb-4">Crear Nueva Orden</h2>
        <form method="POST" action="{{ url_for('crear_orden') }}">
            <div class="form-group">
                <label for="cliente_id">Cliente</label>
                <select class="form-control" id="cliente_id" name="cliente_id" required>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id }}">{{ cliente.nombre }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="fecha">Fecha</label>
                <input type="date" class="form-control" id="fecha" name="fecha" required>
            </div>
            <div class="form-group">
                <label for="estado">Estado</label>
                <input type="text" class="form-control" id="estado" name="estado" value="Pendiente" required>
            </div>
            <div class="form-group">
                <label for="tipo_aparato">Tipo de Aparato</label>
                <select class="form-control" id="tipo_aparato" name="tipo_aparato" required>
                    <option value="Refrigerador">Refrigerador</option>
                    <option value="Lavadora">Lavadora</option>
                </select>
            </div>
            <div class="form-group">
                <label for="tecnico_id">Asignar Técnico</label>
                <select class="form-control" id="tecnico_id" name="tecnico_id">
                    <option value="">Ninguno</option>
                    {% for user in tecnicos %}
                    <option value="{{ user.id }}">{{ user.username }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="form-group">
                <label for="total">Total</label>
                <input type="number" class="form-control" id="total" name="total" step="0.01" required onchange="calculateIGV()">
            </div>
            <div class="form-group">
                <label for="igv">IGV (18%)</label>
                <input type="number" class="form-control" id="igv" name="igv" step="0.01" readonly>
            </div>
            <div class="form-group">
                <label for="valor">Valor (sin IGV)</label>
                <input type="number" class="form-control" id="valor" name="valor" step="0.01" readonly>
            </div>
            <script>
            function calculateIGV() {
                var total = parseFloat(document.getElementById('total').value) || 0;
                var igv = total * (0.18 / 1.18);
                var valor = total - igv;
                document.getElementById('igv').value = igv.toFixed(2);
                document.getElementById('valor').value = valor.toFixed(2);
            }
            </script>
            <button type="submit" class="btn btn-primary btn-block">Crear Orden</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary mt-2">Volver</a>
        </form>
    </div>
{% endblock %}

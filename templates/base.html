<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NovaFrost ERP{% endblock %}</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <!-- PWA OFICIAL NOVAFROST - 100% INSTALABLE -->
    <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">

    <!-- Theme color (soporte light + dark mode) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0066ff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0044cc">

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" sizes="192x192" href="{{ url_for('static', filename='logo192.png') }}">
    <link rel="apple-touch-icon" sizes="512x512" href="{{ url_for('static', filename='logo512.png') }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Favicon estándar (elimina warnings en DevTools y navegadores) -->
    <link rel="icon" href="{{ url_for('static', filename='logo192.png') }}" sizes="192x192">
    <link rel="icon" href="{{ url_for('static', filename='logo512.png') }}" sizes="512x512">

    <!-- Registro del Service Worker (más robusto y con scope explícito) -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('{{ url_for('static', filename='sw.js') }}', { scope: '/' })
                    .then(reg => console.log('Service Worker registrado con éxito →', reg.scope))
                    .catch(err => console.error('Error al registrar el Service Worker:', err));
            });
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            padding-bottom: 80px;
        }
        header {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        header img {
            max-height: 80px;
            height: auto;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .flash-messages {
            text-align: center;
            margin: 15px 0;
        }
        .flash-messages p {
            margin: 8px 0;
        }
        .btn-logout {
            background-color: #dc3545;
        }
    </style>

    <!-- Firebase Push Notifications -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script src="{{ url_for('static', filename='firebase-init.js') }}"></script>
    <script src="{{ url_for('static', filename='push.js') }}"></script>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="NovaFrost ERP">
        <h1 class="mt-2">NOVA FROST</h1>
    </header>

    <div class="container">
        {% with messages = get_flashed_messages(with_categories=false) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for message in messages %}
                        <div class="alert alert-info">{{ message|safe }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NovaFrost ERP{% endblock %}</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

    <!-- PWA MANIFEST + ÍCONOS -->
    <link rel="manifest" href="/static/manifest.json">

    <!-- Theme color light + dark -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0066ff">
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0044cc">

    <!-- Apple / iOS -->
    <link rel="apple-touch-icon" sizes="192x192" href="/static/logo192.png">
    <link rel="apple-touch-icon" sizes="512x512" href="/static/logo512.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <!-- Favicon estándar -->
    <link rel="icon" href="/static/logo192.png" sizes="192x192">
    <link rel="icon" href="/static/logo512.png" sizes="512x512">

    <!-- SERVICE WORKER SIN JINJA DENTRO DE JS → ADIÓS ERRORES VS CODE -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js', { scope: '/' })
                    .then(reg => console.log('Service Worker registrado →', reg.scope))
                    .catch(err => console.error('Error SW:', err));
            });
        }
    </script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            padding-bottom: 80px;
        }
        header {
            text-align: center;
            padding: 15px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        header img {
            max-height: 80px;
            height: auto;
        }
        .container {
            max-width: 900px;
            margin: 20px auto;
            padding: 25px;
            background-color: white;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .flash-messages {
            text-align: center;
            margin: 15px 0;
        }
        .btn-logout {
            background-color: #dc3545;
        }
    </style>

    <!-- Firebase Push Notifications -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-messaging-compat.js"></script>
    <script src="/static/firebase-init.js"></script>
    <script src="/static/push.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header>
        <img src="/static/logo.png" alt="NovaFrost ERP">
        <h1 class="mt-2">NOVA FROST</h1>
    </header>

    <div class="container">
        <!-- Mensajes flash más bonitos -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-messages">
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category if category != 'message' else 'info' }} alert-dismissible fade show">
                            {{ message|safe }}
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <!-- Bootstrap JS (solo una vez, al final) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
